name: Validate HTML and CSS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g htmlhint
          npm install -g stylelint stylelint-config-standard

      - name: Validate HTML
        run: htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS
        run: stylelint "css/*.css" --config-basedir /usr/local/lib/node_modules --config '{"extends":"stylelint-config-standard","rules":{"custom-property-pattern":null,"selector-class-pattern":null,"declaration-block-no-redundant-longhand-properties":null,"alpha-value-notation":null,"color-function-notation":null,"declaration-property-value-no-unknown":null,"no-descending-specificity":null}}'

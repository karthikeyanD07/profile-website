
name: PR Quality Checks

on:
  pull_request:
    branches: [main]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all HTML files have title tags
        run: |
          for file in *.html; do
            if ! grep -q "<title>" "$file"; then
              echo "ERROR: $file is missing <title> tag"
              exit 1
            fi
          done
          echo "All HTML files have title tags"

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check image alt attributes
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class ImageChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.missing = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "img":
                      attributes = dict(attrs)
                      if "alt" not in attributes:
                          self.missing.append(self.getpos())

          errors = []

          for file in Path(".").glob("*.html"):
              checker = ImageChecker()
              checker.feed(file.read_text(encoding="utf-8"))
              for line, column in checker.missing:
                  errors.append(f"{file}:{line}:{column}")

          if errors:
              print("Images missing alt attributes:")
              print("\n".join(errors))
              sys.exit(1)

          print("All images have alt attributes.")
          PY

  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log in JS
        run: |
          if grep -rn "console.log" js/*.js; then
            echo "WARNING: Remove console.log before merging"
            exit 1
          fi
          echo "No console.log found"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      - check-html-titles
      - check-image-alt
      - check-no-console-log
    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
